name: ci

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: nothing in this workflow writes to the repository, and no secrets are used,
# so a fork pull request has exactly the same capabilities as a branch push.
permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Floor 22.13.0 (the `engines.node` minimum, blocking) / primary 24.20.0 (the release
        # baseline, blocking) / canary 26.8.1 (Node Current, non-blocking: `continue-on-error`
        # below so a canary-only regression is visible without failing required checks). The
        # floor is never raised here independently of `engines.node` in package.json.
        node: ['22.13.0', '24.20.0', '26.8.1']
    # Node 26 is a forward-compatibility canary, not yet a supported baseline: a failure on that
    # leg alone must not block merges. `fail-fast: false` above keeps the other legs running
    # regardless, which this only adds to for the canary leg's own reported status.
    continue-on-error: ${{ matrix.node == '26.8.1' }}
    steps:
      # Actions are pinned to immutable commit SHAs. A tag can be moved; a SHA cannot.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # Dependencies are installed from the committed lockfile on every run, so there is
          # nothing to gain from cache detection and one less thing to go wrong.
          package-manager-cache: false

      - name: Enable pnpm from the packageManager pin
        # Refresh corepack before enabling it: the corepack bundled with the minimum supported Node
        # release carries npm registry signing keys that have since rotated, so verifying the
        # pinned pnpm's signature against the current registry fails there. Installing the current
        # corepack restores current keys while keeping signature verification on for every runtime.
        run: |
          npm install --global corepack@latest
          corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # One entry point, the same one the walkthrough documents, so continuous integration cannot
      # drift into running a different set of suites than a reader does. It runs every suite, both
      # typechecks and the acceptance-completeness gate in order, and stops at the first failure.
      - name: Test suite
        run: pnpm test

      # Exercises the egress diagnostics themselves. They are an early warning on a developer
      # machine, not the offline gate; the offline job below is what actually proves it.
      - name: Fixture path with egress diagnostics
        run: pnpm demo:offline

      # REF-DET-001: the binding walkthrough must be byte-identical run to run, or the
      # committed vectors describe something that cannot be reproduced.
      - name: Binding walkthrough determinism
        run: |
          pnpm demo:binding > /tmp/binding-run-1.txt
          pnpm demo:binding > /tmp/binding-run-2.txt
          diff /tmp/binding-run-1.txt /tmp/binding-run-2.txt

      # EVM-DET-001: the end-to-end run rewrites the committed evidence in place, so a difference
      # from what is committed is a determinism failure. Comparing against the repository rather
      # than against a second run also catches evidence committed from a different tree.
      - name: Offline evidence determinism
        run: |
          pnpm demo:fixture > /dev/null
          git diff --exit-code -- fixtures/expected-evidence

  offline:
    name: offline path (no network)
    runs-on: ubuntu-24.04
    env:
      # The runtime for the no-network gate, pinned by digest for the same reason the actions above
      # are pinned by commit SHA: a tag can be repointed, a digest cannot. This is the multi-platform
      # index digest of the node:24 tag, refreshed and verified live against the registry API
      # (registry-1.docker.io); nodejs.org lists 24.20.0 as the current Node 24 LTS release as of
      # this refresh.
      OFFLINE_NODE_IMAGE: 'node:24@sha256:4196d66a565c6f195728d9952f161f4adfe2ad753052a08b7ec7f1c5a6bda42b'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false

      - name: Enable pnpm from the packageManager pin
        # Refresh corepack before enabling it: the corepack bundled with the minimum supported Node
        # release carries npm registry signing keys that have since rotated, so verifying the
        # pinned pnpm's signature against the current registry fails there. Installing the current
        # corepack restores current keys while keeping signature verification on for every runtime.
        run: |
          npm install --global corepack@latest
          corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # REF-NET-001: dependencies are installed before isolation, then the fixture path runs in a
      # container with no network interface. This job verifies that the runtime fixture path
      # requires no network access; it makes no claim about the rest of the CI lifecycle. Plain
      # node runs the sources directly, so the gate depends on no build step of its own.
      - name: Fixture path with networking disabled
        run: |
          docker run --rm --network=none \
            -v "$PWD:/work" -w /work \
            "$OFFLINE_NODE_IMAGE" \
            node src/fixture-demo.ts

      # EVM-NET-001: the end-to-end flow serves and consumes the paid resource over the loopback
      # interface, which exists inside a container with no network interface. Passing here is what
      # shows that the injected facilitator and the wallet stand-in reach nothing outside the
      # process.
      - name: Offline end-to-end flow with networking disabled
        run: |
          docker run --rm --network=none \
            -v "$PWD:/work" -w /work \
            "$OFFLINE_NODE_IMAGE" \
            node src/flow/fixture-e2e.ts

  offline-restricted:
    name: offline path (no network, restricted container)
    runs-on: ubuntu-24.04
    env:
      OFFLINE_NODE_IMAGE: 'node:24@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false

      - name: Enable pnpm from the packageManager pin
        # Refresh corepack before enabling it: the corepack bundled with the minimum supported Node
        # release carries npm registry signing keys that have since rotated, so verifying the
        # pinned pnpm's signature against the current registry fails there. Installing the current
        # corepack restores current keys while keeping signature verification on for every runtime.
        run: |
          npm install --global corepack@latest
          corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # Same claim as the "offline" job above (no network access is needed for the fixture path),
      # under additional container restrictions: a read-only root filesystem and source mount,
      # every Linux capability dropped, no privilege escalation, and only /tmp writable (via
      # tmpfs). Kept as a separate job so a restriction-flag failure is visible on its own rather
      # than narrowing what the primary offline gate proves.
      - name: Fixture path with networking disabled, read-only, capabilities dropped
        run: |
          docker run --rm --network=none \
            --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$PWD:/work:ro" -w /work --tmpfs /tmp \
            "$OFFLINE_NODE_IMAGE" \
            node src/fixture-demo.ts

  secret-scan:
    name: secret scan
    runs-on: ubuntu-24.04
    env:
      # The upstream action is deliberately not used. It requires a license key for repositories
      # owned by an organization, and this workflow uses no secrets at all so that a fork pull
      # request runs exactly what a branch push runs. The open source binary needs neither.
      GITLEAKS_VERSION: '8.30.1'
      # Published checksum for gitleaks_8.30.1_linux_x64.tar.gz. A pinned version says which
      # release was intended; the checksum is what proves the bytes that ran are that release.
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scanning history requires the history.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Verify the scanner detects a synthetic credential before scanning history: a throwaway
      # repository holding one synthetic credential is scanned with the exact binary downloaded
      # above, and detection is required by exit status and by the identity of the rule that fired.
      #
      # The canary value is assembled at run time from two halves. Written whole it would be a real
      # match for the default rule set, and the history scan below reads this workflow file too.
      - name: Prove the scanner detects before trusting it
        env:
          CANARY_PREFIX: 'AKIA'
          CANARY_BODY: 'QYLPMN5HHFTRW6ZA'
        run: |
          set -euo pipefail
          canary="$RUNNER_TEMP/scanner-canary"
          rm -rf "$canary"
          mkdir -p "$canary"
          cd "$canary"
          git init -q -b main .
          git config user.name 'Scanner Canary'
          git config user.email 'canary@example.invalid'
          printf 'aws_access_key_id = %s%s\n' "$CANARY_PREFIX" "$CANARY_BODY" > credentials.txt
          git add credentials.txt
          git commit -qm 'Synthetic credential for scanner self-test'

          set +e
          "$RUNNER_TEMP/gitleaks" git . \
            --no-banner --no-color --redact \
            --report-format json --report-path "$canary/report.json"
          detected=$?
          set -e

          if [ "$detected" -eq 0 ]; then
            echo "The scanner found nothing in a repository where a credential was planted."
            echo "Its verdict on this repository's history would mean nothing, so this job fails."
            exit 1
          fi

          if ! grep -q '"RuleID": *"aws-access-token"' "$canary/report.json"; then
            echo "The scanner reported findings but not the expected rule, so it did not detect"
            echo "the planted credential and its rule set is not what this job assumes."
            cat "$canary/report.json"
            exit 1
          fi

          cd "$RUNNER_TEMP"
          rm -rf "$canary"
          echo "The scanner detected the planted credential, so its result below is meaningful."

      # Scan the full history rather than the working tree: a credential that was committed and
      # later deleted is still published.
      #
      # Gitleaks aborts the scan when git writes to stderr yet can still report "no leaks found"
      # and exit 0. The assertions below fail that case and require a nonzero scanned-commit count.
      - name: Scan history for committed secrets
        run: |
          set -uo pipefail
          set +e
          "$RUNNER_TEMP/gitleaks" git . \
            --config .gitleaks.toml \
            --no-banner --no-color --redact \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json" 2>&1 \
            | tee "$RUNNER_TEMP/scan.log"
          status=${PIPESTATUS[0]}
          set -e

          if grep -q 'stderr is not empty' "$RUNNER_TEMP/scan.log"; then
            echo "The scan aborted on git stderr output, so its result means nothing."
            exit 1
          fi

          commits="$(sed -n 's/.*INF \([0-9][0-9]*\) commits scanned.*/\1/p' "$RUNNER_TEMP/scan.log" | tail -1)"
          if [ -z "$commits" ] || [ "$commits" -eq 0 ]; then
            echo "The scan walked no commits, so it proves nothing about this history."
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo "Secret scan reported findings across $commits commits."
            exit "$status"
          fi

          echo "No findings across $commits commits."
